<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Анна Буквовна</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marmelad&family=Nunito:wght@600;700;800&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fffef8; --grid: rgba(90,150,230,.28); --margin: rgba(235,80,100,.55);
  --hole: #c9c4dc; --hole-edge: #8f89aa;
  --ink: #2d2650; --edge: #2d2650; --fg: #2d2650; --muted: #5f5986; --surface: #ffffff;
  --pink: #ff8fc4; --teal: #6fe0d2; --yellow: #ffe066; --lilac: #c9a6ff; --orange: #ffb35c;
  --green: #a8f0b8; --soft-bg: #ffd9a6; --blue-line: rgba(70,130,220,.65);
  --tile1: #ff7aa8; --tile2: #5fc8ff; --tile3: #ffd23f; --tile4: #b58cff; --tile5: #4fd8d0;
  --on-candy: #2d2650; --hl: #d6336c; --hl-candy: #a8105a; --good-ink: #14663a;
  --bg: var(--paper);
  --font: "Marmelad", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  --paper: #1b2040; --grid: rgba(150,175,255,.15); --margin: rgba(255,120,150,.42);
  --hole: #0e1129; --hole-edge: #5b64a8;
  --ink: #0a0c20; --edge: #8f9aee; --fg: #f1efff; --muted: #b9bce0; --surface: #2a3066;
  --pink: #ea8bb8; --teal: #5fcabd; --yellow: #e8c75a; --lilac: #ab8fe6; --orange: #eca457;
  --green: #84d69c; --soft-bg: #eab26e; --blue-line: rgba(140,175,255,.6);
  --tile1: #e87ba6; --tile2: #5ab5e6; --tile3: #e6c240; --tile4: #a98ce6; --tile5: #4fc4bc;
  --on-candy: #1b1740; --hl: #ff8fb8; --hl-candy: #8d0f4c; --good-ink: #0c5330;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  margin: 0; padding: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
body {
  margin: 0; padding: 0; background: transparent; color: var(--fg);
  font: 20px/1.3 var(--font);
  overflow-x: hidden; min-height: 100vh;
}
/* тетрадь: спираль слева и красное поле */
body::before, .overlay::before {
  content: ""; position: fixed; left: 6px; top: 0; bottom: 0; width: 22px; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, var(--hole) 0 6px, var(--hole-edge) 6.5px 7.5px, transparent 8px) 0 14px / 22px 56px repeat-y;
}
body::after, .overlay::after {
  content: ""; position: fixed; left: 40px; top: 0; bottom: 0; width: 2px; z-index: 0; pointer-events: none; background: var(--margin);
}
#app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 12px 18px 32px 54px; overflow-wrap: anywhere; }
button {
  font: inherit; color: inherit; border: 0; cursor: pointer;
  min-height: 56px; border-radius: 18px; padding: 10px 18px;
  touch-action: manipulation;
}
button:disabled { opacity: .55; cursor: default; }
input { font: inherit; }
.hidden { display: none !important; }
.hl { color: var(--hl); font-weight: 700; }
.muted { color: var(--muted); }
.card .hl, .task .hl, .fb .hl, .kid .hl, .rulecard .hl, .exitem .hl, .big .hl { color: var(--hl-candy); }

/* Анна Буквовна */
.anna { display: flex; align-items: center; gap: 14px; margin: 8px 0 16px; }
.anna .face {
  position: relative; width: 76px; height: 76px; flex: none; border-radius: 50%;
  background: #ffe0ee; border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  display: grid; place-items: center; font-size: 40px; line-height: 1;
}
.anna .face::after { content: "🎀"; position: absolute; top: -14px; right: -12px; font-size: 28px; transform: rotate(15deg); }
.anna .say { flex: 1; min-width: 0; }
.anna .nm { color: var(--hl); margin: 0 0 4px 8px; font-size: 20px; }
.bubble {
  background: var(--surface); color: var(--fg); border: 3px solid var(--edge); border-radius: 20px 20px 20px 4px;
  box-shadow: 3px 3px 0 var(--edge); padding: 8px 14px; white-space: pre-line;
}

/* Меню: конфетные карточки */
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 14px; margin: 8px 0 14px; padding-right: 6px; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-align: center; width: 100%; min-height: 128px; padding: 14px 4px;
  border: 4px solid var(--ink); border-radius: 22px; box-shadow: 5px 5px 0 var(--ink);
  color: var(--on-candy); background: var(--pink);
}
.menu .card:nth-child(odd) { transform: rotate(-1deg); }
.menu .card:nth-child(even) { transform: rotate(1deg); }
.card.wide { grid-column: 1 / -1; flex-direction: row; gap: 16px; min-height: 96px; text-align: left; padding: 12px 18px; }
.card:active { transform: translate(3px, 4px) rotate(0); box-shadow: 2px 2px 0 var(--ink); }
.card .ico { font-size: 44px; line-height: 1; flex: none; }
.card b { display: block; font-size: 24px; font-weight: 400; line-height: 1.15; overflow-wrap: normal; word-break: normal; }
.card span.s { display: block; font-size: 20px; line-height: 1.2; }
.card.k-pink { background: var(--pink); } .card.k-teal { background: var(--teal); }
.card.k-yellow { background: var(--yellow); } .card.k-lilac { background: var(--lilac); }
.stk {
  position: absolute; top: -14px; right: -8px; width: 38px; height: 38px; border-radius: 50%;
  background: var(--surface); color: var(--fg); border: 3px solid var(--ink); display: grid; place-items: center;
  font-size: 20px; line-height: 1; transform: rotate(12deg);
}
.strip {
  background: var(--yellow); color: var(--on-candy); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 3px 3px 0 var(--ink); padding: 8px 14px 12px; margin: 0 6px 18px 0; transform: rotate(-.8deg);
}
.strip .srow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pbar { height: 18px; margin-top: 6px; background: #fff; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: repeating-linear-gradient(45deg, #ff6fb0 0 10px, #ff9ccb 10px 20px); }

/* Шапка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; min-height: 56px; padding-right: 6px; }
.back {
  background: var(--surface); color: var(--fg); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge);
  border-radius: 28px; min-height: 56px; padding: 6px 16px;
}
.back:active, .next:active, .big:active, .sayb:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.stat {
  background: var(--orange); color: var(--on-candy); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  border-radius: 30px; padding: 8px 14px; white-space: nowrap; font-size: 22px; transform: rotate(1.5deg);
}
.dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; padding-right: 6px; }
.dots i { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--edge); display: block; }
.dots i.on { background: var(--yellow); border-color: var(--ink); transform: scale(1.25); }
.dots i.ok { background: var(--green); border-color: var(--ink); }
.dots i.no { background: var(--orange); border-color: var(--ink); }
.tag {
  display: block; width: fit-content; max-width: 100%; margin: 4px auto 10px; padding: 2px 14px; text-align: center;
  background: var(--yellow); color: var(--on-candy) !important; border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1.5deg);
}

.task {
  display: block; width: fit-content; max-width: 100%; margin: 12px auto; padding: 4px 14px; text-align: center;
  background: var(--yellow); color: var(--on-candy); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 3px 3px 0 var(--ink); transform: rotate(-1deg); font-weight: 400;
}
h2.task { font-size: 24px; }
.task.small, .task.bar { background: none; border: 0; box-shadow: none; transform: none; padding: 0; color: var(--muted); }
.task.bar { color: var(--fg); }
.wordrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin: 12px 0 18px; padding-right: 4px; }
.word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

/* буквы-магниты */
.t {
  position: relative; min-width: 38px; height: 64px; min-height: 64px; padding: 0 4px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; line-height: 1;
  font: 700 38px/1 var(--font); color: var(--on-candy);
  background: var(--tile1); border: 3px solid var(--ink); box-shadow: 3px 4px 0 var(--ink);
}
.word .t:nth-child(5n+1) { background: var(--tile1); transform: rotate(-5deg); }
.word .t:nth-child(5n+2) { background: var(--tile2); transform: rotate(4deg); }
.word .t:nth-child(5n+3) { background: var(--tile3); transform: rotate(-3deg); }
.word .t:nth-child(5n+4) { background: var(--tile4); transform: rotate(3deg); }
.word .t:nth-child(5n+5) { background: var(--tile5); transform: rotate(-4deg); }
.word.stressw .t.static { background: var(--surface); color: var(--fg); border-color: var(--edge); box-shadow: 2px 3px 0 var(--edge); transform: none; }
.word .t.blank { background: var(--surface); color: var(--hl); border: 3px dashed var(--edge); box-shadow: none; transform: none; }
.word .t.dim { background: var(--surface); color: var(--muted); border: 3px dashed var(--edge); box-shadow: none; opacity: .6; transform: none; }
.word .t.hl { background: var(--green); color: var(--on-candy); transform: none; }
.word .t.soft { background: var(--orange); color: var(--on-candy); }
.word .t.good {
  background: var(--green); color: var(--on-candy); z-index: 3;
  transform: translateY(-6px) scale(1.15) rotate(2deg);
  box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink), 3px 5px 0 6px var(--ink);
  animation: popin .45s;
}
.word .t.good::after {
  content: "✓"; position: absolute; top: -17px; right: -15px; width: 28px; height: 28px; border-radius: 50%;
  background: #fff; border: 3px solid var(--ink); color: #14803a; font-size: 18px; font-weight: 900;
  display: grid; place-items: center;
}
.word .t.cutafter { border-right: 9px solid #ff3d8f; border-radius: 14px 4px 4px 14px; }
@keyframes popin { 0% { transform: scale(.8); } 60% { transform: translateY(-12px) scale(1.3) rotate(3deg); } 100% { transform: translateY(-6px) scale(1.15) rotate(2deg); } }

.sayb {
  width: 56px; height: 56px; min-height: 56px; padding: 0; font-size: 26px; border-radius: 50%; flex: none;
  background: var(--teal); color: var(--on-candy); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
}

/* варианты ответа */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; padding-right: 6px; }
.choices.three { grid-template-columns: 1fr 1fr 1fr; }
.choices.four { grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.choices.one { grid-template-columns: 1fr; }
.big {
  position: relative; min-height: 72px; font-size: 28px; line-height: 1.15; color: var(--on-candy); background: var(--pink);
  border: 4px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--ink); padding: 8px 10px;
}
.choices .big:nth-child(4n+1) { background: var(--pink); }
.choices .big:nth-child(4n+2) { background: var(--teal); }
.choices .big:nth-child(4n+3) { background: var(--yellow); }
.choices .big:nth-child(4n+4) { background: var(--lilac); }
.big.twoline { font-size: 22px; line-height: 1.2; }
.big.good, .choices .big.good { background: var(--green); }
.choices .big.good { transform: scale(1.05); animation: popin2 .4s; }
.choices .big.good::after {
  content: "✓"; position: absolute; top: -14px; right: -10px; width: 28px; height: 28px; border-radius: 50%;
  background: #fff; border: 3px solid var(--ink); color: #14803a; font-size: 18px; font-weight: 900; display: grid; place-items: center;
}
.big.soft, .choices .big.soft { background: var(--orange); }
.big.soft:disabled { opacity: .9; }
.opts .big.opt, .big.opt {
  background: var(--surface); color: var(--fg); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge);
  font-size: 22px; line-height: 1.25; text-align: left; min-height: 64px;
}
.opts .big.opt:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--edge); }
@keyframes popin2 { 0% { transform: scale(.9); } 60% { transform: scale(1.12); } 100% { transform: scale(1.05); } }

.clap { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 6px 0; }
.clapbtn {
  width: 170px; height: 170px; border-radius: 50%; font-size: 80px; padding: 0; background: var(--yellow);
  border: 5px solid var(--ink); box-shadow: 6px 7px 0 var(--ink);
}
.clapbtn:active { transform: translate(4px, 5px) scale(.97); box-shadow: 2px 2px 0 var(--ink); }
.count {
  font-size: 56px; min-height: 76px; min-width: 96px; line-height: 1.2; text-align: center; padding: 0 12px;
  background: var(--surface); color: var(--fg); border: 3px dashed var(--edge); border-radius: 20px;
}
.row2 .big.alt { background: var(--teal); }
.row2 { display: flex; gap: 14px; width: 100%; padding-right: 6px; }
.row2 > button { flex: 1; }
.ghost { background: var(--surface); color: var(--fg); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); }
.help {
  width: 100%; margin-top: 10px; background: var(--surface); color: var(--fg);
  border: 3px dashed var(--edge); border-radius: 20px;
}
.helpbox { margin-top: 10px; padding: 12px 14px; border-radius: 18px; background: var(--surface); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--edge); }
.helpbox .lbl { color: var(--hl); margin-bottom: 4px; }
.helpbox .ex { font-size: 36px; line-height: 1.2; margin: 4px 0 2px; }

/* ответы Анны Буквовны на попытку */
.fb {
  position: relative; min-height: 28px; text-align: center; font-size: 22px; margin: 14px 6px 10px 0; padding: 10px 14px;
  color: var(--on-candy); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 3px 3px 0 var(--ink); white-space: pre-line;
}
.fb:empty { display: none; }
.fb.ok { background: var(--green); }
.fb.soft { background: var(--soft-bg); }
.fb.ok::after { content: "✨"; position: absolute; top: -16px; right: -8px; font-size: 26px; animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { transform: scale(.8) rotate(0); opacity: .6; } 50% { transform: scale(1.2) rotate(20deg); opacity: 1; } }
.fb .pieces { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; font-size: 36px; }
.fb .pc { background: var(--surface); color: var(--fg); border: 3px solid var(--ink); border-radius: 12px; padding: 0 10px; box-shadow: 2px 3px 0 var(--ink); }
.fb .big-word { font-size: 38px; margin-top: 4px; }
.fb .lt { color: var(--good-ink); text-decoration: underline; text-decoration-thickness: 3px; }

.next, .primary, .finish {
  display: block; width: 100%; font-size: 24px; margin-top: 10px; color: var(--on-candy);
  border: 4px solid var(--ink); border-radius: 20px; box-shadow: 4px 4px 0 var(--ink); min-height: 60px;
}
.next, .finish { background: var(--green); }
.primary { background: var(--pink); }
.wide { width: 100%; margin-top: 12px; }
.acts .ghost, .final .ghost { font-size: 22px; min-height: 60px; border-radius: 20px; }
.next:disabled, .finish:disabled { opacity: .7; }

/* Урок */
.eyebrow { text-align: center; color: var(--muted); margin: 0 0 6px; }
.exlist { display: grid; gap: 14px; margin: 12px 6px 16px 0; }
.exitem {
  color: var(--on-candy); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink);
  padding: 8px 14px; font-size: 36px; line-height: 1.2; text-align: center; background: var(--yellow);
}
.exitem:nth-child(4n+1) { background: var(--yellow); transform: rotate(-1deg); }
.exitem:nth-child(4n+2) { background: var(--teal); transform: rotate(.8deg); }
.exitem:nth-child(4n+3) { background: var(--pink); transform: rotate(-.6deg); }
.exitem:nth-child(4n+4) { background: var(--lilac); transform: rotate(1deg); }
.rulecard {
  position: relative; background: var(--lilac); color: var(--on-candy); border: 4px solid var(--ink); border-radius: 22px;
  box-shadow: 5px 5px 0 var(--ink); padding: 14px 16px; margin: 14px 6px 14px 0; font-size: 28px; line-height: 1.3; text-align: center;
  transform: rotate(-.6deg);
}
.rulecard::after {
  content: "💡"; position: absolute; top: -16px; right: -8px; width: 40px; height: 40px; border-radius: 50%; background: var(--surface);
  border: 3px solid var(--ink); display: grid; place-items: center; font-size: 22px; transform: rotate(12deg);
}
.kid {
  margin: 12px 6px 12px 0; padding: 10px 14px; border-radius: 18px; background: var(--teal); color: var(--on-candy);
  border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-size: 22px;
}
.streak {
  display: block; width: fit-content; max-width: 100%; margin: 6px auto 12px; padding: 4px 14px; text-align: center; font-size: 22px;
  background: var(--orange); color: var(--on-candy); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 3px 3px 0 var(--ink);
}
.opts { display: grid; gap: 14px; margin: 12px 6px 12px 0; }

/* Темы, прогресс */
.list { display: grid; gap: 14px; margin: 10px 6px 10px 0; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 64px;
  color: var(--on-candy); background: var(--pink); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 4px 4px 0 var(--ink); padding: 10px 14px;
}
.list .row:nth-child(4n+1) { background: var(--pink); transform: rotate(-.5deg); }
.list .row:nth-child(4n+2) { background: var(--teal); transform: rotate(.5deg); }
.list .row:nth-child(4n+3) { background: var(--yellow); transform: rotate(-.4deg); }
.list .row:nth-child(4n+4) { background: var(--lilac); transform: rotate(.4deg); }
.row .n {
  display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%;
  background: var(--surface); color: var(--fg); border: 3px solid var(--ink); font-size: 20px;
}
.list .row.off { background: var(--surface); color: var(--muted); border: 3px dashed var(--edge); box-shadow: none; transform: none; }
.row.off .n { background: transparent; color: var(--muted); border-color: var(--edge); border-style: dashed; }
.row .grow { flex: 1; min-width: 0; }
.bar { font-size: 26px; letter-spacing: 2px; line-height: 1.25; }
.box {
  position: relative; background: var(--surface); color: var(--fg); border: 3px solid var(--edge); border-radius: 20px;
  box-shadow: 4px 4px 0 var(--edge); padding: 14px 14px; margin: 18px 6px 14px 0;
}
.box h3 {
  display: inline-block; margin: -26px 0 8px; padding: 2px 12px; font-size: 22px; font-weight: 400;
  background: var(--yellow); color: var(--on-candy); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 2px 3px 0 var(--ink); transform: rotate(-1.5deg);
}
.box p { margin: 4px 0; }
.ach { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.ach.lock { opacity: .5; filter: grayscale(1); }
.ach .i {
  display: grid; place-items: center; width: 44px; height: 44px; flex: none; font-size: 26px; border-radius: 50%;
  background: var(--yellow); border: 3px solid var(--ink);
}
.kv b { font-weight: 400; margin-left: auto; text-align: right; }
.kv { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; padding: 4px 0; border-bottom: 2px dashed var(--grid); }
.kv:last-child { border-bottom: 0; }

/* Финал и оверлей */
.final { text-align: center; padding-right: 6px; }
.final h1 { font-size: 36px; font-weight: 400; margin: 8px 0; color: var(--hl); line-height: 1.15; }
.bigstars { font-size: 30px; line-height: 1.25; margin: 4px 0; overflow-wrap: anywhere; }
.final p { margin: 6px 0; }
.again { margin: 10px 0; text-align: left; }
.final .acts, .acts { display: grid; gap: 14px; margin-top: 18px; }
.party { font-size: 72px; line-height: 1.1; animation: pop .6s; }
.overlay {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: 24px 18px 24px 54px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.overlay .in { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: 24px; z-index: 30; max-width: 488px; margin: 0 auto;
  background: var(--yellow); color: var(--on-candy); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 12px 16px; border-radius: 18px; text-align: center;
}
.dictline { position: relative; margin: 18px 6px 10px 0; }
.dictline::after { content: "✏️"; position: absolute; right: -8px; top: -20px; font-size: 32px; transform: rotate(15deg); pointer-events: none; }
.dict-in {
  display: block; width: 100%; font: 400 36px/1.2 var(--font); min-height: 80px; padding: 6px 14px 20px; text-align: center;
  color: var(--fg); border: 3px solid var(--edge); border-radius: 14px; box-shadow: 3px 3px 0 var(--edge); border-radius: 14px;
  background-color: var(--surface);
  background-image: linear-gradient(to bottom, transparent calc(100% - 16px), var(--blue-line) calc(100% - 16px), var(--blue-line) calc(100% - 14px), transparent calc(100% - 14px));
}
.dict-in:focus { outline: none; box-shadow: 3px 3px 0 var(--edge), 0 0 0 4px var(--yellow); }
.dict-in:disabled { opacity: .85; }

/* конфетти и анимации */
.shake { animation: wob .5s; }
@keyframes wob { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 45% { transform: rotate(8deg); } 70% { transform: rotate(-5deg); } }
.pop { animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.15); } }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
.confetti i {
  position: absolute; top: -30px; left: var(--x, 50%); font-style: normal; font-size: var(--s, 22px); opacity: 0;
  animation: fall var(--d, 3.2s) linear var(--w, 0s) 1 forwards;
}
@keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(540deg); opacity: 1; } }
@media (max-width: 400px) {
  .t { min-width: 28px; padding: 0 2px; font-size: 36px; }
  .word { gap: 4px; }
  .wordrow { gap: 8px; }
  .word .t { padding: 0 1px; }
  .card b { font-size: 20px; }
  .card.wide b { font-size: 26px; }
  .rulecard { font-size: 26px; }
  .exitem { font-size: 34px; }
  .choices.four .big { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .confetti { display: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
(function () {
  var TG = (window.Telegram && window.Telegram.WebApp) || null;
  var IN_TG = !!(TG && TG.platform && TG.platform !== "unknown");
  var ROUND = 8;
  var KIDMARK = "§§";          // в data.json на это место подставляется очередное объяснение rule_kid
  var DATA = null;
  var app = document.getElementById("app");
  var URLP = null;
  try { URLP = new URLSearchParams(location.search); } catch (e) {}
  function urlParam(k) { try { return URLP ? URLP.get(k) : null; } catch (e) { return null; } }
  var DBG = { shift: 0 };      // для проверок: сдвиг «сегодня» в днях

  /* ---------- Telegram и тема ---------- */
  function applyTheme() {
    var root = document.documentElement;
    var scheme = "light";
    if (TG && IN_TG && TG.colorScheme) scheme = TG.colorScheme;
    else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) scheme = "dark";
    root.setAttribute("data-theme", scheme);
    // «тетрадь» всегда своя: светлая бумага или тёмно-синяя «ночная тетрадь»
    var paper = scheme === "dark" ? "#1b2040" : "#fffef8";
    if (TG && IN_TG) {
      var v = function (x) { try { return TG.isVersionAtLeast(x); } catch (e) { return false; } };
      if (v("6.1")) {
        try { TG.setHeaderColor(paper); } catch (e) {}
        try { TG.setBackgroundColor(paper); } catch (e) {}
      }
      if (v("7.10")) { try { TG.setBottomBarColor(paper); } catch (e) {} }
    }
  }
  if (TG) {
    try { TG.ready(); TG.expand(); } catch (e) {}
    try { TG.onEvent("themeChanged", applyTheme); } catch (e) {}
  }
  applyTheme();
  if (window.matchMedia) {
    try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}
  }

  /* ---------- помощники ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(arr, n) { return shuffle(arr.slice()).slice(0, n); }
  function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function slogWord(n) {
    var m = n % 10, h = n % 100;
    if (m === 1 && h !== 11) return "слог";
    if (m >= 2 && m <= 4 && (h < 12 || h > 14)) return "слога";
    return "слогов";
  }
  var VOW = "аоуыэяёюие";
  function isVowel(c) { return VOW.indexOf(c.toLowerCase()) >= 0; }
  function countV(w) { var n = 0; for (var i = 0; i < w.length; i++) if (isVowel(w.charAt(i))) n++; return n; }
  function norm(s) { return String(s).trim().toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " "); }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function bytes(s) { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 2; } }

  // Текст с <b>…</b> из curriculum.py -> безопасные узлы (жирное = цветная буква)
  function rich(str) {
    var f = document.createDocumentFragment();
    var bold = false;
    String(str == null ? "" : str).split(/(<\/?b>)/).forEach(function (p) {
      if (p === "<b>") bold = true;
      else if (p === "</b>") bold = false;
      else if (p) f.appendChild(bold ? el("span", "hl", p) : document.createTextNode(p));
    });
    return f;
  }
  function richEl(tag, cls, str) { var e = el(tag, cls); e.appendChild(rich(str)); return e; }

  var PRAISE_GAME = ["Молодец!", "Умница!", "Отлично!", "Здорово!", "Так держать!", "Супер!"];
  var SOFT = "Почти! Попробуй ещё";

  var GAMES = {
    stress: { title: "Поймай ударение", ico: "⚡", sub: "Найди ударную гласную", skill: "stress", prefix: "stress:", kind: "stress", h: 262 },
    clap:   { title: "Хлопушка", ico: "👏", sub: "Считаем слоги", skill: "syllables", prefix: "syl:", kind: "syl", h: 42 },
    spy:    { title: "Шпион-звук", ico: "🕵️", sub: "Гласный или согласный?", skill: "vowels", prefix: "snd:", kind: "snd", h: 170 },
    dict:   { title: "Вставь букву", ico: "✏️", sub: "Словарные слова", skill: "", prefix: "gap:", kind: "gap", h: 330 }
  };
  var ORDER = ["stress", "clap", "spy", "dict"];
  var KIND = { syl_count: "syl", syl_split: "syl", stress: "stress", first_sound: "snd", sentence: "sent", gap: "gap" };

  /* =====================================================================
     ХРАНЕНИЕ ПРОГРЕССА
     CloudStorage Telegram (по ключам p_*, каждое значение < 4096) + localStorage.
     Работает и без них: тогда прогресс живёт, пока открыта страница.
     ===================================================================== */
  var KEYS = ["p_skills", "p_dict", "p_due", "p_stats", "p_pend"];
  var PR = null;
  function freshPR() {
    return {
      skills: {},    // id -> {s: серия, m: освоен, t: попыток, r: верных}
      dict: {},      // слово -> {s: серия, l: выучено, t: попыток}
      due: {},       // ключ -> {g: этап, d: день, e: промахов}
      stats: { ts: 0, days: [], stars: 0, games: {}, les: null },
      pend: { sec: 0, ms: [], g: {}, r: [] }   // итог, ещё не отправленный боту
    };
  }
  PR = freshPR();

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function parseJ(s, def) {
    try { var v = JSON.parse(s); return v && typeof v === "object" ? v : def; } catch (e) { return def; }
  }
  function cloudOK() {
    try { return !!(IN_TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9")); }
    catch (e) { return false; }
  }

  function applyStored(src) {
    var P = freshPR();
    var sk = parseJ(src.p_skills, {});
    Object.keys(sk).forEach(function (k) {
      var a = sk[k]; if (a && a.length >= 4) P.skills[k] = { s: a[0], m: a[1], t: a[2], r: a[3] };
    });
    var dc = parseJ(src.p_dict, {});
    Object.keys(dc).forEach(function (k) {
      var a = dc[k]; if (a && a.length >= 3) P.dict[k] = { s: a[0], l: a[1], t: a[2] };
    });
    var du = parseJ(src.p_due, {});
    Object.keys(du).forEach(function (k) {
      var a = du[k]; if (a && a.length >= 3) P.due[k] = { g: a[0], d: a[1], e: a[2] };
    });
    var st = parseJ(src.p_stats, {});
    P.stats = { ts: st.ts || 0, days: st.days || [], stars: st.stars || 0, games: st.games || {}, les: st.les || null };
    var pd = parseJ(src.p_pend, {});
    P.pend = { sec: pd.sec || 0, ms: pd.ms || [], g: pd.g || {}, r: pd.r || [] };
    PR = P;
  }

  function loadProgress(done) {
    var local = {};
    KEYS.forEach(function (k) { local[k] = lsGet(k); });
    var finished = false;
    function fin(cloud) {
      if (finished) return;
      finished = true;
      var useCloud = false;
      if (cloud) {
        var cs = parseJ(cloud.p_stats, {}), ls = parseJ(local.p_stats, {});
        useCloud = (cs.ts || 0) > (ls.ts || 0);
      }
      try { applyStored(useCloud ? cloud : local); } catch (e) { PR = freshPR(); }
      done();
    }
    if (cloudOK()) {
      var t = setTimeout(function () { fin(null); }, 2500);
      try {
        TG.CloudStorage.getItems(KEYS, function (err, vals) { clearTimeout(t); fin(err ? null : vals); });
      } catch (e) { clearTimeout(t); fin(null); }
    } else fin(null);
  }

  function serialize(k) {
    var o = {}, p;
    if (k === "p_skills") {
      Object.keys(PR.skills).forEach(function (id) { p = PR.skills[id]; o[id] = [p.s, p.m, p.t, p.r]; });
    } else if (k === "p_dict") {
      Object.keys(PR.dict).forEach(function (w) { p = PR.dict[w]; o[w] = [p.s, p.l, p.t]; });
    } else if (k === "p_due") {
      // не больше ~3,8 КБ: лишние (самые далёкие по этапу) выбрасываем
      var keys = Object.keys(PR.due);
      var s;
      keys.forEach(function (key) { p = PR.due[key]; o[key] = [p.g, p.d, p.e]; });
      s = JSON.stringify(o);
      while (bytes(s) > 3800 && keys.length) {
        keys.sort(function (a, b) { return (PR.due[b].g - PR.due[a].g) || (PR.due[b].d - PR.due[a].d); });
        var drop = keys.shift(); delete o[drop]; delete PR.due[drop];
        s = JSON.stringify(o);
      }
      return s;
    } else if (k === "p_stats") {
      PR.stats.days = PR.stats.days.slice(-60);
      return JSON.stringify(PR.stats);
    } else if (k === "p_pend") {
      return JSON.stringify(PR.pend);
    }
    return JSON.stringify(o);
  }

  var dirty = {}, saveT = null;
  function mark(k) {
    dirty[k] = 1;
    if (!saveT) saveT = setTimeout(flush, 500);
  }
  function flush() {
    if (saveT) { clearTimeout(saveT); saveT = null; }
    var ks = Object.keys(dirty);
    if (!ks.length) return;
    PR.stats.ts = Date.now();
    dirty.p_stats = 1;
    dirty.p_pend = 1;
    ks = Object.keys(dirty);
    dirty = {};
    ks.forEach(function (k) {
      var s = serialize(k);
      lsSet(k, s);
      if (cloudOK()) {
        try { TG.CloudStorage.setItem(k, s, function () {}); } catch (e) {}
      }
    });
  }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); });

  /* ---------- логика прогресса (как в progress.py у бота) ---------- */
  function today() {
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) + DBG.shift;
  }
  function rules() { return DATA.rules; }
  function skillRec(id) { return PR.skills[id] || (PR.skills[id] = { s: 0, m: 0, t: 0, r: 0 }); }
  function isMastered(id) { var s = PR.skills[id]; return !!(s && s.m); }
  function skillLevel(id) { var s = PR.skills[id]; return !s ? 0 : s.m ? rules().mastery : Math.min(s.s, rules().mastery - 1); }
  function bar(level) {
    var n = rules().mastery, out = "";
    for (var i = 0; i < n; i++) out += i < level ? "🟩" : "⬜";
    return out;
  }
  function recordSkill(id, correct, countStreak) {
    var s = skillRec(id), newly = false;
    s.t++;
    if (correct) {
      s.r++;
      if (countStreak) {
        s.s++;
        if (s.s >= rules().mastery && !s.m) { s.m = 1; newly = true; }
      }
    } else if (countStreak) s.s = 0;
    mark("p_skills");
    return { streak: s.s, newly: newly };
  }
  function dictRec(w) { return PR.dict[w] || (PR.dict[w] = { s: 0, l: 0, t: 0 }); }
  function recordDict(w, correct) {
    var s = dictRec(w);
    s.t++;
    if (correct) { s.s++; if (s.s >= rules().dict_learned) s.l = 1; }
    else { s.s = 0; s.l = 0; }
    mark("p_dict");
  }
  function learnedCount() {
    var n = 0;
    Object.keys(PR.dict).forEach(function (k) { if (PR.dict[k].l) n++; });
    return n;
  }
  function recordItem(key, correct) {
    var t = today(), iv = rules().intervals, item;
    if (!correct) {
      item = PR.due[key] || { g: 0, d: 0, e: 0 };
      item.g = 0; item.e++; item.d = t + iv[0];
      PR.due[key] = item;
    } else {
      item = PR.due[key];
      if (item && item.d <= t) {
        item.g++;
        if (item.g >= iv.length) delete PR.due[key];
        else item.d = t + iv[item.g];
      }
    }
    mark("p_due");
  }
  function dueKeys() {
    var t = today();
    return Object.keys(PR.due).filter(function (k) { return PR.due[k].d <= t; })
      .sort(function (a, b) { return PR.due[a].d - PR.due[b].d; });
  }
  function touchDay() {
    var t = today();
    if (PR.stats.days.indexOf(t) < 0) { PR.stats.days.push(t); mark("p_stats"); }
  }
  function daysStreak() {
    var set = {}, n = 0, cur = today();
    PR.stats.days.forEach(function (d) { set[d] = 1; });
    if (!set[cur]) cur--;
    while (set[cur]) { n++; cur--; }
    return n;
  }
  function addStars(n) { if (n > 0) { PR.stats.stars += n; mark("p_stats"); } }

  function pendAdd(r) {
    PR.pend.r.push(r);
    while (bytes(JSON.stringify(PR.pend)) > 3800 && PR.pend.r.length > 1) PR.pend.r.shift();
    mark("p_pend");
  }
  function pendMastered(id) {
    if (PR.pend.ms.indexOf(id) < 0) PR.pend.ms.push(id);
    mark("p_pend");
  }

  /* ---------- озвучка ---------- */
  var ruVoice = null;
  var canSpeak = false;
  function findVoice() {
    if (!("speechSynthesis" in window)) return;
    var vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) {}
    ruVoice = null;
    for (var i = 0; i < vs.length; i++) {
      if ((vs[i].lang || "").toLowerCase().replace("_", "-").indexOf("ru") === 0) { ruVoice = vs[i]; break; }
    }
    canSpeak = !!ruVoice;
    var bs = document.querySelectorAll(".sayb");
    for (var k = 0; k < bs.length; k++) bs[k].classList.toggle("hidden", !canSpeak);
  }
  if ("speechSynthesis" in window) {
    findVoice();
    try { speechSynthesis.addEventListener("voiceschanged", findVoice); } catch (e) {}
    setTimeout(findVoice, 800);
  }
  function say(text, rate) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU"; u.voice = ruVoice; u.rate = rate || 0.8;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function stopSpeech() { try { speechSynthesis.cancel(); } catch (e) {} }
  function sayBtn(text) {
    var b = el("button", "sayb" + (canSpeak ? "" : " hidden"), "🔊");
    b.setAttribute("aria-label", "Послушать слово");
    b.onclick = function () { say(text); };
    return b;
  }

  /* =====================================================================
     ОБОЛОЧКА: экраны, кнопка «назад», таймер занятия
     ===================================================================== */
  var epoch = 0;                         // меняется при смене экрана: старые таймеры не трогают новый
  var hasTGBack = !!(IN_TG && TG && TG.BackButton);
  var backFn = null;
  if (hasTGBack) {
    try { TG.BackButton.onClick(function () { if (backFn) backFn(); }); } catch (e) { hasTGBack = false; }
  }
  function setBack(fn) {
    backFn = fn || null;
    if (hasTGBack) { try { if (fn) TG.BackButton.show(); else TG.BackButton.hide(); } catch (e) {} }
  }
  function screen(back) {
    epoch++;
    stopSpeech();
    clear(app);
    setBack(back);
    window.scrollTo(0, 0);
  }
  function later(fn, ms) {
    var my = epoch;
    setTimeout(function () { if (my === epoch) fn(); }, ms);
  }
  function topbar(back, title) {
    var top = el("div", "top");
    if (back && !hasTGBack) {
      var b = el("button", "back", "← " + (title || "Меню"));
      b.onclick = back;
      top.appendChild(b);
    } else top.appendChild(el("div"));
    top.appendChild(el("div", "stat", "⭐ " + PR.stats.stars));
    app.appendChild(top);
  }
  function annaRow(text) {
    var r = el("div", "anna");
    r.appendChild(el("div", "face", "👩‍🏫"));
    var sw = el("div", "say");
    sw.appendChild(el("div", "nm", "Анна Буквовна"));
    var b = el("div", "bubble");
    b.appendChild(typeof text === "string" ? rich(text) : text);
    sw.appendChild(b);
    r.appendChild(sw);
    return r;
  }
  // лёгкое конфетти из звёздочек: чистый CSS, отключается при prefers-reduced-motion
  function confetti(parent) {
    var c = el("div", "confetti"), chars = ["⭐", "✨", "🎊", "🍬", "💖", "🌟"];
    c.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 16; i++) {
      var p = el("i", null, chars[i % chars.length]);
      p.style.setProperty("--x", (2 + Math.random() * 92) + "%");
      p.style.setProperty("--d", (2.6 + Math.random() * 2) + "s");
      p.style.setProperty("--w", (Math.random() * 1.2) + "s");
      p.style.setProperty("--s", (18 + Math.random() * 14) + "px");
      c.appendChild(p);
    }
    parent.appendChild(c);
    setTimeout(function () { if (c.parentNode) c.remove(); }, 7000);
  }
  function toast(text) {
    var old = document.getElementById("toast");
    if (old) old.remove();
    var t = el("div", "toast", text);
    t.id = "toast";
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 2600);
  }
  function tgName() {
    try { return window.Telegram.WebApp.initDataUnsafe.user.first_name || ""; } catch (e) { return ""; }
  }
  function scrollTo(node) { var calm = false; try { calm = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {} try { node.scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" }); } catch (e) {} }

  /* ----- таймер занятия: 15 минут активного времени ----- */
  var SESS_MIN = 15;
  var sessSec = 0, breakAt = 0, breakShown = false;
  (function () {
    var q = parseFloat(urlParam("sessmin"));
    SESS_MIN = q > 0 ? q : 15;
    breakAt = SESS_MIN * 60;
  })();
  setInterval(function () {
    if (document.hidden || !DATA) return;
    sessSec++;
    PR.pend.sec++;
    if (sessSec % 30 === 0) mark("p_pend");
  }, 1000);

  function maybeBreak() {
    if (breakShown || sessSec < breakAt || !DATA) return false;
    breakShown = true;
    var ov = el("div", "overlay");
    ov.id = "breakOverlay";
    var inn = el("div", "in final");
    inn.appendChild(el("div", "party", "🌟"));
    confetti(inn);
    inn.appendChild(el("h1", null, "Ты сегодня хорошо поработала!"));
    inn.appendChild(el("p", null, "Закончим или ещё одну игру?"));
    var acts = el("div", "acts");
    var b1 = el("button", "finish", "✅ Закончить");
    b1.onclick = function () { ov.remove(); showFinish(); };
    var b2 = el("button", "primary", "🎮 Ещё одну игру");
    b2.onclick = function () {
      ov.remove();
      breakAt = sessSec + 10 * 60;        // следующее напоминание через 10 минут
      breakShown = false;
      showGames();
    };
    acts.appendChild(b1); acts.appendChild(b2);
    inn.appendChild(acts);
    ov.appendChild(inn);
    document.body.appendChild(ov);
    return true;
  }

  /* =====================================================================
     МЕНЮ
     ===================================================================== */
  function SK(id) { return DATA.skills.filter(function (s) { return s.id === id; })[0]; }
  function nextSkillId() {

  /* =====================================================================

  var recent = [];
  function remember(w) { if (w) { recent.push(w); if (recent.length > 12) recent.shift(); } }
  function pickFresh(pool, keyf) {
    var fresh = pool.filter(function (x) { return recent.indexOf(keyf(x)) < 0; });
    return rnd(fresh.length ? fresh : pool);
  }
  function find(arr, f) { for (var i = 0; i < arr.length; i++) if (f(arr[i])) return arr[i]; return null; }

  function newEx(type, o) {
    o = o || {};
    var it, ex;
    if (type === "syl_count" || type === "syl_split") {
      var pool = DATA.syllables;
      if (type === "syl_split") pool = pool.filter(function (x) { return x.parts.length >= 2; });
      it = o.word ? find(DATA.syllables, function (x) { return x.word === o.word; }) : pickFresh(pool, function (x) { return x.word; });
      if (!it) return null;
      ex = { type: type, skill: "syllables", item: it, word: it.word, T: type === "syl_count" ? it.count : it.split };
    } else if (type === "stress") {
      it = o.word ? find(DATA.stress, function (x) { return x.word === o.word; }) : pickFresh(DATA.stress, function (x) { return x.word; });
      if (!it) return null;
      ex = { type: type, skill: "stress", item: it, word: it.word, T: it };
    } else if (type === "first_sound") {
      var sp = o.any ? DATA.sound : DATA.sound.filter(function (x) { return x.name; });
      it = o.word ? find(DATA.sound, function (x) { return x.word === o.word; }) : pickFresh(sp, function (x) { return x.word; });
      if (!it) return null;
      ex = { type: type, skill: "vowels", item: it, word: it.word, T: it };
    } else if (type === "sentence") {
      it = pickFresh(DATA.sentences, function (x) { return x.original; });
      var kind = rnd(["cap", "end", "both"]);
      ex = { type: type, skill: "sentence", item: it, word: it.original, kind: kind, T: it.v[kind], text: it.v[kind].text };
    } else if (type === "gap") {
      it = o.word ? find(DATA.dictionary, function (x) { return x.word === o.word; }) : pickFresh(DATA.dictionary, function (x) { return x.word; });
      if (!it) return null;
      ex = { type: type, skill: "", item: it, word: it.word, T: it };
    } else return null;
    ex.att = 0;
    remember(ex.word);
    return ex;
  }
  function wordKey(ex) {
    var k = KIND[ex.type];
    if (ex.type === "sentence") return null;
    return { syl: "syl:", stress: "stress:", snd: "snd:", gap: "gap:" }[k] + ex.word;
  }
  function exForKey(key) {
    var i = key.indexOf(":"), kind = key.slice(0, i), val = key.slice(i + 1);
    if (kind === "skill") { var s = SK(val); return s ? newEx(rnd(s.task_types)) : null; }
    if (kind === "gap") return newEx("gap", { word: val });
    if (kind === "syl") return newEx(Math.random() < 0.6 ? "syl_count" : "syl_split", { word: val });
    if (kind === "stress") return newEx("stress", { word: val });
    if (kind === "snd") return newEx("first_sound", { word: val, any: true });
    return null;
  }

  /* --- запись результата задания (как у бота: _record_first_miss и on_correct) --- */
  function resEntry(ex, ok, count) {
    return { w: ex.type === "sentence" ? "" : ex.word, o: ok ? 1 : 0, s: ex.skill || "", k: KIND[ex.type], c: count ? 1 : 0 };
  }
  function recordMiss(ex, mode) {
    var count = mode === "lesson" || mode === "training";
    if (ex.skill) { recordSkill(ex.skill, false, count); recordItem("skill:" + ex.skill, false); }
    var wk = wordKey(ex);
    if (wk) recordItem(wk, false);
    if (ex.type === "gap") recordDict(ex.word, false);
    pendAdd(resEntry(ex, false, count));
    touchDay();
  }
  function recordHit(ex, mode) {
    var count = mode === "lesson" || mode === "training";
    var r = { streak: 0, newly: false };
    if (ex.skill) {
      r = recordSkill(ex.skill, true, count);
      recordItem("skill:" + ex.skill, true);
      if (r.newly) pendMastered(ex.skill);
    }
    var wk = wordKey(ex);
    if (wk) recordItem(wk, true);
    if (ex.type === "gap") recordDict(ex.word, true);
    pendAdd(resEntry(ex, true, count));
    touchDay();
    return r;
  }

  /* --- «Не понимаю»: следующее объяснение rule_kid по кругу --- */
  var KID_IDX = {};
  // сравнение без тегов, дефисов, ё=е и с одинаковыми буквами подряд (ли-си-и-ица = лисица)
  function squash(s) {
    return String(s).replace(/<[^>]+>/g, "").toLowerCase().replace(/ё/g, "е").replace(/[^а-яa-z']/g, "").replace(/(.)\1+/g, "$1");
  }
  // объяснение не должно разбирать именно текущее слово: иначе оно выдаст ответ
  function kidFits(kid, ex) {
    if (!ex || ex.type === "sentence") return true;
    var w = squash(ex.word || "");
    if (w.length >= 3 && squash(kid).indexOf(w) >= 0) return false;
    if (ex.item && ex.item.trap && kid.indexOf("й'") >= 0) return false;
    return true;
  }
  function nextKid(sid, ex) {
    var kids = SK(sid).rule_kid;
    var i = KID_IDX[sid] == null ? 1 : KID_IDX[sid];
    var n = kids.length, pick = i % n, used = 1;
    for (var k = 0; k < n; k++) {
      if (kidFits(kids[(i + k) % n], ex)) { pick = (i + k) % n; used = k + 1; break; }
    }
    KID_IDX[sid] = i + used;
    return kids[pick];
  }
  // пример «Вот пример» берём на другом слове, чем текущее
  function pickExample(sk, ex) {
    var list = sk.examples, n = list.length;
    for (var k = 0; k < n; k++) {
      var cand = list[(R_EX.n + k) % n];
      if (squash(cand.split(" — ")[0]) !== squash(ex.word || "")) { R_EX.n += k + 1; return cand; }
    }
    return list[R_EX.n++ % n];
  }
  var R_EX = { n: 0 };

  /* --- проверка слогов (порт curriculum.check_syl_split / split_feedback) --- */
  function checkSplit(word, parts) {
    if (!parts.length) return false;
    if (parts.map(norm).join("") !== norm(word)) return false;
    if (parts.some(function (p) { return countV(p) !== 1; })) return false;
    return parts.length === countV(word);
  }
  function splitFeedback(word, parts) {
    var n = countV(word);
    if (!parts.length || parts.map(norm).join("") !== norm(word))
      return "Склей свои части вместе: получится ли слово «" + word + "»? Буквы терять нельзя.";
    if (parts.length !== n)
      return "Посчитай гласные в слове «" + word + "»: сколько их — столько и частей. А у тебя частей: " + parts.length + ".";
    var bad = find(parts, function (p) { return countV(p) !== 1; });
    if (bad) return "Посмотри на часть «" + bad + "»: в слоге должна быть ровно одна гласная.";
    return "Посчитай гласные в слове «" + word + "»: столько их — столько и частей.";
  }

  /* =====================================================================
     ИСПОЛНИТЕЛЬ ЗАДАНИЯ: подсказка 1 -> подсказка 2 -> ответ с разбором
     o: {mode, help, onDone(info)}
     ===================================================================== */
  function runExercise(box, ex, o) {
    var my = epoch;
    window.__cur = ex;          // для проверок
    var R = { locked: false, helpN: 0, missed: false };
    var wbox = el("div");
    var fb = el("div", "fb");
    var helpBox = el("div");
    var helpBtn = null;
    box.appendChild(wbox);

    function feedback(cls, content) {
      clear(fb);
      fb.className = "fb " + cls;
      fb.appendChild(typeof content === "string" ? rich(content) : content);
    }
    function alive() { return my === epoch && !R.locked; }

    function finish(clean, revealed) {
      if (!alive()) return;
      R.locked = true;
      var info = { clean: clean, revealed: revealed, newly: false, streak: 0 };
      var pr = ex.T.pr || "";
      if (ex.type === "gap") pr = "\n" + pr;
      var msg;
      if (clean) {
        var r = recordHit(ex, o.mode);
        info.newly = r.newly; info.streak = r.streak;
        msg = rnd(DATA.phrases.praise) + pr;
        if (o.mode === "lesson" && !r.newly && ex.skill) {
          msg += "\nПодряд верно: " + r.streak + " из " + rules().mastery;
        }
        if (r.newly && o.mode !== "lesson") msg += "\n🏆 Навык «" + SK(ex.skill).title + "» освоен!";
        addStars(2);
        feedback("ok", msg);
      } else if (revealed) {
        feedback("soft", ex.T.rv);
        if (ex.revealUI) ex.revealUI();
      } else {
        addStars(1);
        feedback("ok", "Получилось! 🌟 Теперь запомним." + pr);
      }
      if (helpBtn) helpBtn.classList.add("hidden");
      stopSpeech();
      o.onDone(info);
    }

    // промах: подсказка 1, подсказка 2 (следующее объяснение rule_kid), потом ответ
    function miss(ans) {
      if (!alive()) return;
      ex.att++;
      if (ex.att === 1) {
        recordMiss(ex, o.mode);
        feedback("soft", ex.type === "syl_split" ? "Почти! Давай проверим. " + splitFeedback(ex.word, ans || []) : ex.T.h1);
      } else if (ex.att === 2) {
        var kid = nextKid(ex.skill, ex);
        feedback("soft", ex.T.h2.replace(KIDMARK, kid));
      } else finish(false, true);
      scrollTo(fb);
    }
    function hit() { finish(ex.att === 0, false); }
    var A = { alive: alive, hit: hit, miss: miss, feedback: feedback, finish: finish, R: R };

    var builders = { syl_count: wSylCount, syl_split: wSylSplit, stress: wStress, first_sound: wFirstSound, sentence: wSentence, gap: wGap };
    builders[ex.type](wbox, ex, A);

    if (o.help && ex.skill) {
      helpBtn = el("button", "help", "🤔 Не понимаю");
      helpBtn.onclick = function () {
        if (R.locked) return;
        var sk = SK(ex.skill);
        var kid = nextKid(sk.id, ex);
        var exm = pickExample(sk, ex);
        R.helpN++;
        clear(helpBox);
        helpBox.className = "helpbox";
        helpBox.appendChild(el("div", "lbl", "Давай по-другому:"));
        helpBox.appendChild(richEl("div", null, kid));
        helpBox.appendChild(el("div", "lbl", "Вот пример:"));
        helpBox.appendChild(richEl("div", "ex", exm));
        if (ex.T.my) {
          helpBox.appendChild(el("div", "lbl", "А теперь твоё слово:"));
          helpBox.appendChild(richEl("div", null, ex.T.my));
        }
        scrollTo(helpBox);
      };
      box.appendChild(helpBtn);
      box.appendChild(helpBox);
    }
    box.appendChild(fb);
    return A;
  }

  function wordRow(box, word, tiles) {
    var row = el("div", "wordrow");

  /* --- слоги: сколько? --- */
  function wSylCount(box, ex, A) {

    var n = Math.max(4, ex.item.parts.length);

      btns.push(b); ch.appendChild(b);
    })(i);

  /* --- слоги: раздели слово (нажимай на букву, после которой слог кончается) --- */
  function wSylSplit(box, ex, A) {
    box.appendChild(el("div", "task", "Раздели слово на слоги"));
    box.appendChild(el("div", "task small", "Нажимай на букву, после которой слог заканчивается"));

    function paint(locked) {
      clear(word);

        var t = el("button", "t" + (cuts[i] ? " cutafter" : ""), w.charAt(i));
        t.style.minHeight = "64px";

      var inGroup = {};
      it.groups.forEach(function (g, n) { g.pos.forEach(function (p) { inGroup[p] = n; }); });
      for (var i = 0; i < it.word.length; i++) {
        var n = inGroup[i], t = el("div", "t static");
        if (n === undefined) t.textContent = it.word.charAt(i);
        else if (solved[n]) { t.textContent = it.word.charAt(i); t.classList.add("hl"); }
        else if (n === active) { t.textContent = "_"; t.classList.add("blank"); }
        else { t.textContent = "_"; t.classList.add("dim"); }
        w.appendChild(t);
      }
    }
    function options() {
      clear(chWrap);
      var g = it.groups[gi];
      var opts = shuffle(g.options.slice());
      var ch = el("div", "choices " + (opts.length === 3 ? "three" : opts.length === 2 ? "" : "one"));
      var tries = 0, busy = false;
      opts.forEach(function (op) {
        var b = el("button", "big", op);
        b.onclick = function () {
          if (!A.alive() || busy) return;
          tries++;
          if (op === g.answer) {
            b.classList.add("good"); solved[gi] = true;
            if (tries > 1) anyMiss = true;
            advance(false);
          } else {
            if (!anyMiss) { anyMiss = true; recordMiss(ex, ex.mode || "dictionary"); A.feedback("soft", it.h1); }
            else A.feedback("soft", DATA.phrases.soft);
            if (tries >= 2) { anyReveal = true; solved[gi] = true; b.classList.add("soft"); advance(true); }
            else { b.classList.add("soft", "shake"); b.disabled = true; }
          }
        };
        ch.appendChild(b);
      });
      chWrap.appendChild(ch);
      paint(gi);
      function advance(revealed) {
        busy = true;
        paint(-1);
        if (gi + 1 < it.groups.length) {
          A.feedback(revealed ? "soft" : "ok", revealed ? "Смотри: здесь «" + g.answer + "». Идём дальше." : rnd(PRAISE_GAME) + " Идём дальше.");
          later(function () { gi++; options(); }, 900);
          return;
        }
        clear(chWrap);
        ex.att = anyMiss ? 1 : 0;
        ex.revealUI = null;
        A.finish(!anyMiss, anyReveal);
      }
    }
    options();
  }

  var RUN = null;

  var RUN_TITLE = { training: "✍️ Тренировка", dictionary: "📖 Словарные слова", dictation: "🎧 Диктант" };

  function startRun(kind) {
    if (kind === "dictation") { dictationEntry(); return; }
    RUN = { kind: kind, total: RUN_SIZE[kind], done: 0, ok: 0, weak: [], res: [], dueUsed: [] };
    runNext();
  }
  function trainingKinds() {
    var touched = Object.keys(PR.skills).filter(function (k) { return PR.skills[k].t > 0 && SK(k); });
    var skills = touched.length ? touched : DATA.skills.map(function (s) { return s.id; });
    var kinds = ["gap"];
    skills.forEach(function (id) { kinds = kinds.concat(SK(id).task_types); });
    return kinds;
  }
  function pickRunEx() {
    var run = RUN, ex = null, fromDue = false;
    // 1) сначала то, что пора повторить
    var keys = dueKeys();
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (run.dueUsed.indexOf(key) >= 0) continue;
      if (run.kind === "dictionary" && key.indexOf("gap:") !== 0) continue;
      ex = exForKey(key);
      if (ex) { run.dueUsed.push(key); fromDue = true; break; }
    }
    if (!ex) {
      if (run.kind === "training") ex = newEx(rnd(trainingKinds()));
      else {
        var unl = DATA.dictionary.filter(function (d) { return !(PR.dict[d.word] && PR.dict[d.word].l); }).map(function (d) { return d.word; });
        var pool = unl.filter(function (w) { return recent.indexOf(w) < 0; });
        if (!pool.length) pool = DATA.dictionary.map(function (d) { return d.word; }).filter(function (w) { return recent.indexOf(w) < 0; });
        if (!pool.length) pool = DATA.dictionary.map(function (d) { return d.word; });
        ex = newEx("gap", { word: rnd(pool) });
      }
    }
    ex.mode = run.kind;
    ex.fromDue = fromDue;
    return ex;
  }
  function runDots() {
    var dots = el("div", "dots");
    for (var i = 0; i < RUN.total; i++) {
      var d = el("i"), r = RUN.res[i];
      if (r !== undefined) d.className = r ? "ok" : "no";

      dots.appendChild(d);
    }
    return dots;
  }
  function runNext() {
    if (RUN.done >= RUN.total) { finishRun(); return; }
    var ex = pickRunEx();
    screen(showMenu);
    topbar(showMenu);
    app.appendChild(el("div", "eyebrow", RUN_TITLE[RUN.kind] + " · " + (RUN.done + 1) + " из " + RUN.total));
    app.appendChild(runDots());
    if (ex.fromDue) app.appendChild(el("div", "tag", "🔁 Пора повторить"));

      mode: RUN.kind, help: RUN.kind === "training",
      onDone: function (info) {
        RUN.res.push(info.clean);

  function dictationEntry() {
    RUN = { kind: "dictation", total: RUN_SIZE.dictation, done: 0, ok: 0, weak: [], res: [], dueUsed: [] };
    screen(showMenu);
    topbar(showMenu);

    var tries = 0;
    (function poll() {
      findVoice();
      if (canSpeak) { dictationNext(); return; }

      noVoiceScreen();
    })();

  function noVoiceScreen() {
    screen(showMenu);
    topbar(showMenu);
    app.appendChild(annaRow("На этом устройстве нет русского голоса, диктант есть в чате бота"));

    app.appendChild(b);

  function pickDictation() {
    var D = DATA.dictation, run = RUN;
    var keys = dueKeys();
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      if (key.indexOf("gap:") !== 0 || run.dueUsed.indexOf(key) >= 0) continue;
      var w = find(D.words, function (x) { return x.text === key.slice(4); });
      if (w) { run.dueUsed.push(key); return { it: w, kind: "word", fromDue: true }; }
    }
    if (Math.random() < 0.6) return { it: pickFresh(D.words, function (x) { return x.text; }), kind: "word" };
    return { it: pickFresh(D.sentences, function (x) { return x.text; }), kind: "sentence" };
  }
  function dcore(s) { return (norm(s).match(/[а-яa-z0-9]+/g) || []).join(" "); }
  function checkDictation(text, ans) { return dcore(ans) === dcore(text); }
  function boldAt(word, idxs) {
    var set = {}, out = "", open = false;
    idxs.forEach(function (i) { set[i] = 1; });
    for (var i = 0; i < word.length; i++) {
      if (set[i] && !open) { out += "<b>"; open = true; }
      else if (!set[i] && open) { out += "</b>"; open = false; }
      out += word.charAt(i);
    }
    return open ? out + "</b>" : out;
  }
  // буквы правильного написания, которых нет в ответе (порт highlight_diff, через LCS)
  function highlightDiff(correct, given) {
    var a = correct.toLowerCase().replace(/ё/g, "е"), b = given.trim().toLowerCase().replace(/ё/g, "е");
    var n = a.length, m = b.length, i, j, L = [];
    for (i = 0; i <= n; i++) { L.push([]); for (j = 0; j <= m; j++) L[i].push(0); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--)
      L[i][j] = a.charAt(i) === b.charAt(j) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var bold = [], matched = {};
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a.charAt(i) === b.charAt(j)) { matched[i] = 1; i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { bold.push(i); i++; }
      else { bold.push(Math.max(0, Math.min(i, n - 1))); j++; }   // лишняя буква в ответе
    }
    while (i < n) { bold.push(i); i++; }
    if (j < m) bold.push(Math.max(0, n - 1));
    if (!bold.length) bold = [0];
    return boldAt(correct, bold);
  }
  function yoNote(text, ans) {
    if (/ё/i.test(text) && !/ё/i.test(ans)) {
      var idx = [];
      for (var i = 0; i < text.length; i++) if (text.charAt(i).toLowerCase() === "ё") idx.push(i);
      return "Всё верно! Только в слове пишется буква <b>ё</b>: " + boldAt(text, idx);
    }
    return null;
  }

  function dictationNext() {
    if (RUN.done >= RUN.total) { finishRun(); return; }
    var pk = pickDictation(), item = pk.it, text = item.text;
    remember(text);
    window.__dtext = text;      // для проверок
    screen(showMenu);
    topbar(showMenu);
    app.appendChild(el("div", "eyebrow", RUN_TITLE.dictation + " · " + (RUN.done + 1) + " из " + RUN.total));

    app.appendChild(el("div", "task", "Послушай и напиши то, что услышишь ✍️"));
    var row = el("div", "row2");

    b2.onclick = function () { say(text, 0.6); };
    row.appendChild(b1); row.appendChild(b2);
    app.appendChild(row);
    var inp = el("input", "dict-in");
    inp.type = "text"; inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
    inp.setAttribute("autocorrect", "off");
    inp.setAttribute("aria-label", "Напиши, что услышала");
    var dl = el("div", "dictline");
    dl.appendChild(inp);
    app.appendChild(dl);
    var chk = el("button", "next", "Проверить");
    var fb = el("div", "fb");
    app.appendChild(chk);
    app.appendChild(fb);
    var done = false;
    function check() {
      if (done) return;
      var ans = inp.value;
      if (!ans.trim()) { fb.className = "fb soft"; fb.textContent = "Напиши то, что услышала 🙂"; return; }
      done = true;
      inp.disabled = true; chk.classList.add("hidden"); b1.disabled = b2.disabled = true;
      stopSpeech();
      var ok = checkDictation(text, ans);
      var dw = item.dw || [];
      var bad = [];
      if (ok) {
        dw.forEach(function (d) { recordDict(d.word, true); recordItem("gap:" + d.word, true); pendAdd({ w: d.word, o: 1, s: "", k: "gap", c: 0 }); });
        addStars(2);
        var msg = rnd(DATA.phrases.praise), note = yoNote(text, ans);
        if (note) msg += "\n" + note;
        clear(fb); fb.className = "fb ok"; fb.appendChild(rich(msg));
      } else {
        if (pk.kind === "word") bad = dw;
        else {
          var given = {};
          (norm(ans).match(/[а-яa-z0-9]+/g) || []).forEach(function (w) { given[w] = 1; });
          bad = dw.filter(function (d) { return !given[norm(d.word)]; });
        }
        bad.forEach(function (d) { recordDict(d.word, false); recordItem("gap:" + d.word, false); pendAdd({ w: d.word, o: 0, s: "", k: "gap", c: 0 }); RUN.weak.push(d.word); });
        var m2 = "Почти! Давай разберём 🙂\nВот как пишется: " + highlightDiff(text, ans);
        if (bad.length) {
          var d0 = bad[0];
          m2 += "\nТрудное место в слове «" + d0.word.toLowerCase() + "»: " + boldAt(d0.word, d0.hard) + " — это надо запомнить.";
        }
        clear(fb); fb.className = "fb soft"; fb.appendChild(rich(m2));
      }
      touchDay();
      RUN.res.push(ok); RUN.done++; if (ok) RUN.ok++;
      var last = RUN.done >= RUN.total;
      var nb = el("button", "next", last ? "Готово! 🎉" : "Дальше →");
      nb.onclick = function () { if (maybeBreak()) return; dictationNext(); };
      app.appendChild(nb);
      scrollTo(nb);
    }
    chk.onclick = check;
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); check(); } });
    later(function () { say(text, 0.8); }, 250);
    later(function () { try { inp.focus(); } catch (e) {} }, 400);
  }

    app.appendChild(annaRow("Во что сыграем?"));
    var m = el("div", "menu");
    var gk = ["pink", "teal", "yellow", "lilac"], gs = ["🎯", "🎈", "🔍", "🍬"];
    ORDER.forEach(function (k, gi) {
      var g = GAMES[k];
      var b = el("button", "card k-" + gk[gi % 4]);
      b.appendChild(el("span", "stk", gs[gi % 4]));
      b.appendChild(el("div", "ico", g.ico));
      var d = el("div");
      d.appendChild(el("b", null, g.title));
      var best = (PR.stats.games[k] || [0])[0];
      d.appendChild(el("span", "s", g.sub + (best ? " · рекорд ⭐ " + best : "")));
      b.appendChild(d);
      b.onclick = function () { if (!maybeBreak()) startGame(k); };
      m.appendChild(b);
    });
    app.appendChild(m);
  }
  function buildItems(game) {
    if (game === "stress") return pick(DATA.stress, ROUND).map(function (x) { return { word: x.word, idx: x.idx, sub: x.sub, h1: x.h1 }; });
    if (game === "clap") return pick(DATA.syllables, ROUND);
    if (game === "spy") return pick(DATA.sound, ROUND);
    return pick(DATA.dictionary, ROUND);
  }
  function startGame(game) {
    S = { game: game, items: buildItems(game), i: 0, score: 0, stars: 0, streak: 0, best: 0, results: [], locked: false };
    gRender();
  }
  function gFrame() {
    screen(showGames);
    topbar(showGames, "Игры");
    var dots = el("div", "dots");
    for (var i = 0; i < S.items.length; i++) {
      var d = el("i"), r = S.results[i];
      if (r) d.className = r.ok ? "ok" : "no";
      else if (i === S.i) d.className = "on";
      dots.appendChild(d);
    }
    app.appendChild(dots);
    var st = el("div", "tag");
    st.id = "gstat";
    app.appendChild(st);
    gStat();
  }
  function gStat() {
    var st = document.getElementById("gstat");
    if (!st) return;
    st.style.color = "var(--fg)";
    st.textContent = GAMES[S.game].title + " · ⭐ " + S.stars + (S.streak >= 2 ? "  🔥 " + S.streak : "");
  }
  function gRender() {
    S.cur = { tries: 0, missed: false, done: false };
    S.locked = false;
    gFrame();
    var item = S.items[S.i];
    var box = el("div");
    app.appendChild(box);
    var fb = el("div", "fb");
    var next = el("button", "next hidden", S.i + 1 >= S.items.length ? "Готово! 🎉" : "Дальше →");
    next.onclick = gNext;
    S.fb = fb; S.next = next; S.box = box;
    if (S.game === "stress") qStress(box, item);
    else if (S.game === "clap") qClap(box, item);
    else if (S.game === "spy") qSpy(box, item);
    else qDict(box, item);
    app.appendChild(fb);
    app.appendChild(next);
  }
  function gfeedback(cls, text, extra) {
    clear(S.fb);
    S.fb.className = "fb " + cls;
    S.fb.appendChild(document.createTextNode(text));
    if (extra) S.fb.appendChild(extra);
  }
  // Итог по слову: points 2 (с первого раза), 1 (со второго), 0 (показали ответ)
  function finishWord(word, points, clean) {
    var g = GAMES[S.game];
    S.cur.done = true;
    S.stars += points;
    S.score += points;
    addStars(points);
    if (clean) { S.streak++; if (S.streak > S.best) S.best = S.streak; }
    else S.streak = 0;
    S.results.push({ word: word, ok: clean, skill: g.skill });
    // прогресс — как в боте для игр: серия навыка не считается
    if (g.skill) recordSkill(g.skill, clean, false);
    recordItem(g.prefix + word, clean);
    if (S.game === "dict") recordDict(word, clean);
    pendAdd({ w: word, o: clean ? 1 : 0, s: g.skill, k: g.kind, c: 0 });
    touchDay();
    gStat();
    var dots = document.querySelectorAll(".dots i");
    if (dots[S.i]) dots[S.i].className = clean ? "ok" : "no";
    S.next.classList.remove("hidden");
    S.locked = true;
    scrollTo(S.next);
  }
  function gNext() {
    stopSpeech();
    S.i++;
    if (S.i >= S.items.length) gFinal();
    else gRender();
  }

  /* игра 1: Поймай ударение */
  function qStress(box, it) {
    box.appendChild(el("div", "task", "Нажми на ударную гласную"));
    var row = el("div", "wordrow");
    var w = el("div", "word stressw");
    var tiles = [];
    for (var i = 0; i < it.word.length; i++) {
      (function (i) {
        var ch = it.word.charAt(i);
        var t = el("button", "t " + (isVowel(ch) ? "v" : "static"), ch);
        if (!isVowel(ch)) {
          t.onclick = function () { if (S.locked) return; gfeedback("soft", "Ищем гласную. Они выделены цветом 🙂"); };
        } else {
          t.onclick = function () { onStressTap(it, i, tiles); };
        }
        tiles.push(t);
        w.appendChild(t);
      })(i);
    }
    row.appendChild(w);
    row.appendChild(sayBtn(it.word));
    box.appendChild(row);
    box.appendChild(el("div", "task small", it.sub));
  }
  function onStressTap(it, i, tiles) {
    if (S.locked) return;
    S.cur.tries++;
    if (i === it.idx) {
      tiles[i].className = "t good";
      tiles[i].textContent = it.word.charAt(i) + "́";
      lockTiles(tiles);
      gfeedback("ok", rnd(PRAISE_GAME) + " Ударение на «" + it.word.charAt(i) + "»", stressWord(it));
      finishWord(it.word, S.cur.tries === 1 ? 2 : 1, S.cur.tries === 1);
    } else if (S.cur.tries >= 2) {
      tiles[i].className = "t soft";
      tiles[it.idx].className = "t good";
      tiles[it.idx].textContent = it.word.charAt(it.idx) + "́";
      lockTiles(tiles);
      gfeedback("soft", "Смотри: ударение на «" + it.word.charAt(it.idx) + "». Запомним!", stressWord(it));
      finishWord(it.word, 0, false);
    } else {
      S.cur.missed = true;
      tiles[i].className = "t soft shake";
      tiles[i].disabled = true;
      gfeedback("soft", it.h1);
    }
  }
  function lockTiles(tiles) { tiles.forEach(function (t) { t.disabled = true; t.style.opacity = "1"; }); }

  /* игра 2: Хлопушка */
  function qClap(box, it) {
    box.appendChild(el("div", "task", "Сколько слогов? Хлопай и нажми «Готово»"));
    var row = el("div", "wordrow");
    var w = el("div", "word");
    for (var i = 0; i < it.word.length; i++) w.appendChild(el("div", "t static", it.word.charAt(i)));
    row.appendChild(w);
    row.appendChild(sayBtn(it.word));
    box.appendChild(row);
    var c = el("div", "clap");

    var n = 0;
    var btn = el("button", "clapbtn", "👏");
    btn.setAttribute("aria-label", "Хлопок");
    btn.onclick = function () {
      if (S.locked) return;
      n++; count.textContent = n; count.classList.remove("pop"); void count.offsetWidth; count.classList.add("pop");
    };
    var r2 = el("div", "row2");
    var reset = el("button", "ghost", "↺ Сначала");
    reset.onclick = function () { if (!S.locked) { n = 0; count.textContent = "0"; } };
    var done = el("button", "big good", "Готово");
    done.style.minHeight = "56px";
    done.onclick = function () {
      if (S.locked) return;
      if (n === 0) { gfeedback("soft", "Похлопай по слогам 👏"); return; }
      S.cur.tries++;
      var right = n === it.parts.length;
      var pieces = el("div", "pieces");
      it.parts.forEach(function (p) { pieces.appendChild(el("span", "pc", p)); });
      var line = it.parts.join("-") + " — " + it.parts.length + " " + slogWord(it.parts.length);
      if (right) {
        gfeedback("ok", rnd(PRAISE_GAME) + " " + line, pieces);
        finishWord(it.word, S.cur.tries === 1 ? 2 : 1, S.cur.tries === 1);
        btn.disabled = done.disabled = reset.disabled = true;
      } else if (S.cur.tries >= 2) {
        gfeedback("soft", "Смотри, как делится слово: " + line, pieces);
        finishWord(it.word, 0, false);
        btn.disabled = done.disabled = reset.disabled = true;
      } else {
        S.cur.missed = true;
        n = 0; count.textContent = "0";
        gfeedback("soft", SOFT + ": слово «" + it.word + "». В каждом слоге одна гласная.");
      }
    };
    r2.appendChild(reset); r2.appendChild(done);
    c.appendChild(btn); c.appendChild(count); c.appendChild(r2);
    box.appendChild(c);
  }

  /* игра 3: Шпион-звук */
  function trapText(word) {
    var L = word.charAt(0).toUpperCase();
    var snd = { "Я": "[й’а]", "Ю": "[й’у]", "Е": "[й’э]", "Ё": "[й’о]" }[L];
    return "Буква " + L + " в начале прячет два звука: " + snd + ". Первый — согласный [й’].";
  }
  function qSpy(box, it) {
    box.appendChild(el("div", "task", "С какого звука начинается " + (it.name ? "имя" : "слово") + "?"));
    var row = el("div", "wordrow");
    var w = el("div", "word");
    for (var i = 0; i < it.word.length; i++) w.appendChild(el("div", "t static", it.word.charAt(i)));
    row.appendChild(w);
    row.appendChild(sayBtn(it.word));
    box.appendChild(row);
    var ch = el("div", "choices");
    var bv = el("button", "big twoline", "🎵 Гласный звук");
    var bc = el("button", "big alt twoline", "🤐 Согласный звук");
    bc.style.setProperty("--h2", 20);
    var btns = { v: bv, c: bc };
    function answer(k) {
      if (S.locked) return;
      S.cur.tries++;
      var right = k === it.kind;
      var first = it.word.charAt(0);
      var extra = it.trap ? el("div", null, trapText(it.word)) : null;
      if (extra) extra.style.cssText = "font-size:20px;margin-top:6px";
      var kindName = it.kind === "v" ? "гласный" : "согласный";
      if (right) {
        btns[k].classList.add("good");
        gfeedback("ok", rnd(PRAISE_GAME) + " Первый звук — " + kindName + ".", extra);
        finishWord(it.word, S.cur.tries === 1 ? 2 : 1, S.cur.tries === 1);
        bv.disabled = bc.disabled = true; btns[k].style.opacity = 1;
      } else if (S.cur.tries >= 2) {
        btns[it.kind].classList.add("good");
        var msg = it.trap ? "Смотри, тут хитрость." : "Смотри: первая буква «" + first.toUpperCase() + "», звук — " + kindName + ".";
        gfeedback("soft", msg, extra);
        finishWord(it.word, 0, false);
        bv.disabled = bc.disabled = true; btns[it.kind].style.opacity = 1;
      } else {
        S.cur.missed = true;
        btns[k].classList.add("soft", "shake");
        btns[k].disabled = true;
        gfeedback("soft", SOFT + ": протяни первый звук слова «" + it.word + "». Он поётся?");
      }
    }
    bv.onclick = function () { answer("v"); };
    bc.onclick = function () { answer("c"); };
    ch.appendChild(bv); ch.appendChild(bc);
    box.appendChild(ch);
  }

  /* игра 4: Вставь букву */
  function qDict(box, it) {
    box.appendChild(el("div", "task", "Какой буквы не хватает?"));
    var row = el("div", "wordrow");
    var w = el("div", "word");
    row.appendChild(w);
    row.appendChild(sayBtn(it.word));
    box.appendChild(row);
    var chWrap = el("div");
    box.appendChild(chWrap);
    var gi = 0, solved = {}, anyReveal = false;

    function paint(activeGroup) {
      clear(w);
      var inGroup = {};
      it.groups.forEach(function (g, n) { g.pos.forEach(function (p) { inGroup[p] = n; }); });
      for (var i = 0; i < it.word.length; i++) {
        var n = inGroup[i];
        var t = el("div", "t static");
        if (n === undefined) t.textContent = it.word.charAt(i);
        else if (solved[n]) { t.textContent = it.word.charAt(i); t.classList.add("hl"); }
        else if (n === activeGroup) { t.textContent = "_"; t.classList.add("blank"); }
        else { t.textContent = "_"; t.classList.add("dim"); }
        w.appendChild(t);
      }
    }
    function showOptions() {
      clear(chWrap);
      var g = it.groups[gi];
      var opts = shuffle(g.options.slice());
      var ch = el("div", "choices " + (opts.length === 3 ? "three" : opts.length === 2 ? "" : "one"));
      var tries = 0;
      opts.forEach(function (o) {
        var b = el("button", "big", o);
        b.onclick = function () {
          if (S.locked) return;
          tries++;
          S.cur.tries++;
          if (o === g.answer) {
            b.classList.add("good");
            solved[gi] = true;
            if (tries > 1) S.cur.missed = true;
            gapDone(tries === 1);
          } else if (tries >= 2) {
            S.cur.missed = true; anyReveal = true;
            solved[gi] = true;
            b.classList.add("soft");
            gapDone(false, true);
          } else {
            S.cur.missed = true;
            b.classList.add("soft", "shake");
            b.disabled = true;
            gfeedback("soft", it.h1);
          }
        };
        ch.appendChild(b);
      });
      chWrap.appendChild(ch);
      paint(gi);
    }
    function gapDone(first, revealed) {
      var lastGap = gi + 1 >= it.groups.length;
      paint(-1);
      if (!lastGap) {
        S.locked = true;
        gfeedback(revealed ? "soft" : "ok", revealed ? "Смотри: здесь «" + it.groups[gi].answer + "». Идём дальше." : rnd(PRAISE_GAME) + " Идём дальше.");
        var cur = it;
        later(function () {
          if (!S || S.items[S.i] !== cur) return;
          gi++; S.locked = false; showOptions();
        }, 900);
        return;
      }
      clear(chWrap);
      var bigw = el("div", "big-word");
      for (var i = 0; i < it.word.length; i++) {
        var hard = it.groups.some(function (g) { return g.pos.indexOf(i) >= 0; });
        bigw.appendChild(el("span", hard ? "lt" : null, it.word.charAt(i)));
      }
      var clean = !S.cur.missed;
      var pts = clean ? 2 : (anyReveal ? 0 : 1);
      var letters = it.groups.map(function (g) { return "«" + g.answer + "»"; }).join(" и ");
      if (anyReveal) gfeedback("soft", "Словарное слово. Запомним: пишем " + letters, bigw);
      else gfeedback("ok", rnd(PRAISE_GAME) + " Запомни: пишем " + letters, bigw);
      finishWord(it.word, pts, clean);
    }
    showOptions();
  }

  function gFinal() {
    var name = S.game;
    // рекорд и итог игры для отчёта
    var g = PR.stats.games[name] || [0, 0, 0];
    var record = S.score > g[0];
    PR.stats.games[name] = [Math.max(g[0], S.score), g[1] + 1, Math.max(g[2], S.best)];
    var pg = PR.pend.g[name];
    if (!pg || S.score >= pg[0]) PR.pend.g[name] = [S.score, S.best];
    mark("p_stats");
    screen(showGames);
    topbar(showGames, "Игры");
    var okN = S.results.filter(function (r) { return r.ok; }).length;
    var wrap = el("div", "final");
    wrap.appendChild(el("div", "party", "🎉"));
    confetti(wrap);
    wrap.appendChild(el("h1", null, record && g[0] ? "Новый рекорд!" : "Ты молодец!"));
    var stars = "";
    for (var i = 0; i < Math.min(S.stars, 16); i++) stars += "⭐";
    wrap.appendChild(el("div", "bigstars", stars || "⭐"));
    wrap.appendChild(el("p", null, "Звёзд: " + S.stars + ". С первого раза: " + okN + " из " + S.items.length));
    if (S.best >= 2) wrap.appendChild(el("p", null, "🔥 Лучшая серия: " + S.best));
    var again = S.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.word; });
    if (again.length) {
      var a = el("div", "bubble again");

    var b2 = el("button", "ghost", "🎮 Другая игра");
    b2.onclick = function () { if (!maybeBreak()) showGames(); };
    var b3 = el("button", "ghost", "🏠 В меню");
    b3.onclick = showMenu;
    acts.appendChild(b1); acts.appendChild(b2); acts.appendChild(b3);
    wrap.appendChild(acts);
    app.appendChild(wrap);
  }
