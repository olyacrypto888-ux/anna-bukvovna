  /* =====================================================================
     ЗАКОНЧИТЬ: итог занятия -> бот (sendData, v:2)
     ===================================================================== */
  function buildPayload() {
    var pd = PR.pend;
    var p = { v: 2, m: Math.round(pd.sec / 60), ms: pd.ms.slice(), g: JSON.parse(JSON.stringify(pd.g)), r: pd.r.slice() };
    while (bytes(JSON.stringify(p)) > 4000 && p.r.length) p.r.pop();     // обрезаем хвост
    return p;
  }
  function canSendData() {
    if (!IN_TG) return false;
    try { return !(TG.initDataUnsafe && TG.initDataUnsafe.query_id); } catch (e) { return false; }
  }

  function showFinish() {
    screen(showMenu);
    topbar(showMenu);
    var pd = PR.pend;
    var ok = pd.r.filter(function (r) { return r.o; }).length;
    var c = el("div", "final");
    c.appendChild(el("div", "party", "🌸"));
    c.appendChild(el("h1", null, "Занятие окончено"));
    if (pd.r.length) c.appendChild(el("p", null, "Сегодня: " + pd.r.length + " заданий, с первого раза " + ok + ". ⭐ всего " + PR.stats.stars));
    else c.appendChild(el("p", null, "Спасибо, что заглянула! Приходи ещё 🙂"));
    if (pd.ms.length) c.appendChild(el("p", null, "🏆 Освоено: " + pd.ms.map(function (id) { return SK(id) ? SK(id).title : id; }).join(", ")));
    c.appendChild(el("p", "muted", "Анна Буквовна расскажет маме, как всё прошло."));
    var acts = el("div", "acts");
    var send = el("button", "finish", "✅ Закончить и отправить");
    send.onclick = function () { doSend(c, send); };
    var back = el("button", "ghost", "← Ещё позанимаюсь");
    back.onclick = showMenu;
    acts.appendChild(send); acts.appendChild(back);
    c.appendChild(acts);
    app.appendChild(c);
  }

  function doSend(c, btn) {
    var payload = buildPayload();
    window.__lastPayload = payload;
    var json = JSON.stringify(payload);
    if (!payload.r.length && payload.m < 1) {
      if (IN_TG) { try { TG.close(); return; } catch (e) {} }
      toast("Нечего отправлять 🙂");
      return;
    }
    if (!canSendData()) {
      flush();
      var msg = IN_TG
        ? "Всё сохранилось! Чтобы мама увидела итог, в следующий раз открой приложение кнопкой «📱 Анна Буквовна» внизу, под строкой ввода."
        : "Это открыто не в Telegram: итог сохранён здесь и уйдёт боту при запуске из бота.";
      clear(c);
      c.appendChild(el("div", "party", "💾"));
      c.appendChild(el("p", null, msg));
      var cl = el("button", "next", IN_TG ? "Закрыть" : "← В меню");
      cl.onclick = function () { if (IN_TG) { try { TG.close(); return; } catch (e) {} } showMenu(); };
      c.appendChild(cl);
      return;
    }
    btn.disabled = true;
    var snapshot = JSON.stringify(PR.pend);
    // то, что отправляем, из очереди убираем
    PR.pend = { sec: 0, ms: [], g: {}, r: [] };
    mark("p_pend");
    flush();
    setTimeout(function () {
      try { TG.sendData(json); }
      catch (e) { PR.pend = parseJ(snapshot, PR.pend); mark("p_pend"); flush(); btn.disabled = false; btn.textContent = "Не получилось. Нажми ещё раз"; return; }
      // если приложение не закрылось — отправка не прошла, возвращаем итог в очередь
      setTimeout(function () {
        PR.pend = parseJ(snapshot, PR.pend); mark("p_pend"); flush();
        btn.disabled = false; btn.textContent = "Не получилось. Нажми ещё раз";
      }, 2500);
    }, 350);
  }

  /* ---------- старт ---------- */
  function boot() {
    app.appendChild(annaRow("Загружаю уроки… ✨"));
    fetch("data.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        DATA = d;
        loadProgress(function () {
          if (urlParam("go") === "games") showGames();
          else showMenu();
        });
      })
      .catch(function () {
        clear(app);
        app.appendChild(annaRow("Ой, уроки не загрузились. Закрой приложение и открой ещё раз 🙂"));
      });
  }
  boot();

  // для проверок
  window.__app = {
    get PR() { return PR; }, get S() { return S; }, get RUN() { return RUN; }, DBG: DBG,
    buildPayload: buildPayload, flush: flush, showMenu: showMenu, pendAdd: pendAdd, mark: mark,
    setSess: function (sec) { sessSec = sec; }
  };
})();
</script>
</body>
</html>
